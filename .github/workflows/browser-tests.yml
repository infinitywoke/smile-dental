# The browser tests (e2e/) on a phone-sized Chrome, against a test database of their own: a second, free
# Supabase project with the same tables (supabase/schema.sql) and one test login, never the clinic's.
# Every pull request (Dependabot's package updates), every Sunday morning, and on demand, once the four
# E2E_ secrets are set (docs/BROWSER-TESTS.md); until then the run says so and stops, green. Not on every
# push: a run takes 15 to 25 minutes, and GitHub's free 2,000 minutes a month also pay for the nightly
# backup (the build machine runs these tests on each change instead). A failure emails the owner; the
# report, with a trace of each failed test, is kept for a week.
name: Browser tests

on:
  pull_request:
  schedule:
    - cron: '0 1 * * 0' # Sunday 06:30 India time, before the day's appointment times have passed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          URL: ${{ secrets.E2E_SUPABASE_URL }}
          KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ] && [ -n "$EMAIL" ] && [ -n "$PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Browser tests not run: the test database secrets (E2E_...) aren't set yet. See docs/BROWSER-TESTS.md"
          fi

  browser:
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
      # The clinic's clock, as on the owner's phone and the build machine
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The tests read these two files, as on the build machine (e2e/env.ts)
      - name: The test database and its login
        env:
          URL: ${{ secrets.E2E_SUPABASE_URL }}
          KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          printf 'NEXT_PUBLIC_SUPABASE_URL="%s"\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$URL" "$KEY" > .env.local
          printf 'TEST_EMAIL="%s"\nTEST_PASSWORD="%s"\n' "$EMAIL" "$PASSWORD" > .env.test.local

      - name: Install Chrome for the tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
